name: Daily Job Scraper

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QUERY_BATCH_SIZE: "120"
      DATA_RETENTION_DAYS: "120"
      ENABLE_FLYER_OCR: "1"
      MAX_OCR_PER_RUN: "10"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install OCR engine
        run: |
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr

      - name: Install pinned dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run all collectors
        run: python scripts/run_all.py

      - name: Commit refreshed dataset and static website
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): refresh job listings manually"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          file_pattern: data/jobs.json data/run_status.json data/jobs_*.json index.html
