name: INFO LOKER Hourly Scraping

on:
  push:
    branches: [main]
    paths:
      - "scraper/**"
      - "scrapers/**"
      - "scripts/**"
      - "config.yaml"
      - "config/**"
      - "templates/**"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/scrape.yml"
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  collect:
    name: Collect, normalize, and commit job data
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      QUERY_BATCH_SIZE: "120"
      DATA_RETENTION_DAYS: "120"
      ENABLE_FLYER_OCR: "1"
      MAX_OCR_PER_RUN: "10"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install OCR system dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr

      - name: Install pinned Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run all collectors
        run: python scripts/run_all.py

      - name: Commit refreshed dataset safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep the finished scrape output separate from the repository branch.
          # If a code/test commit arrives during scraping, restart from latest main
          # and apply this run's generated files without rebasing two large JSON files.
          output_dir="$(mktemp -d)"
          mkdir -p "$output_dir/data"
          cp data/jobs.json "$output_dir/data/jobs.json"
          cp data/run_status.json "$output_dir/data/run_status.json"
          cp index.html "$output_dir/index.html"
          if compgen -G "data/jobs_*.json" > /dev/null; then
            cp data/jobs_*.json "$output_dir/data/"
          fi
          for generated in data/blocked_domains.json data/company_career_registry.json data/company_scrape_state.json; do
            if [[ -f "$generated" ]]; then cp "$generated" "$output_dir/data/"; fi
          done

          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp "$output_dir/data/jobs.json" data/jobs.json
            cp "$output_dir/data/run_status.json" data/run_status.json
            cp "$output_dir/index.html" index.html
            if compgen -G "$output_dir/data/jobs_*.json" > /dev/null; then
              cp "$output_dir"/data/jobs_*.json data/
            fi
            for generated in data/blocked_domains.json data/company_career_registry.json data/company_scrape_state.json; do
              basename="$(basename "$generated")"
              if [[ -f "$output_dir/data/$basename" ]]; then cp "$output_dir/data/$basename" "$generated"; fi
            done
            git add data/jobs.json data/run_status.json data/jobs_*.json index.html data/blocked_domains.json
            for generated in data/company_career_registry.json data/company_scrape_state.json; do
              if [[ -f "$generated" ]]; then git add "$generated"; fi
            done

            if git diff --cached --quiet; then
              echo "No data or website changes to commit."
              exit 0
            fi

            git commit -m "chore(data): refresh Indonesia job listings"
            if git push origin HEAD:main; then
              echo "Scraped dataset committed successfully."
              exit 0
            fi

            echo "Push raced with a newer commit; retrying from latest main (attempt $attempt)."
            sleep "$((attempt * 2))"
          done

          echo "Could not push refreshed data after four safe retries."
          exit 1
