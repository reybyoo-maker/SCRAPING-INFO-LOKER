name: INFO LOKER Hourly Scraping

on:
  push:
    branches: [main]
    paths:
      - "scraper/**"
      - "scrapers/**"
      - "scripts/**"
      - "config.yaml"
      - "config/**"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/scrape.yml"
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  collect:
    name: Collect, normalize, and commit job data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QUERY_BATCH_SIZE: "120"
      DATA_RETENTION_DAYS: "120"
      ENABLE_FLYER_OCR: "1"
      MAX_OCR_PER_RUN: "10"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install OCR system dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr

      - name: Install pinned Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run all collectors
        run: python scripts/run_all.py

      - name: Commit refreshed dataset safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/run_status.json data/jobs_*.json index.html
          if git diff --cached --quiet; then
            echo "No data or website changes to commit."
            exit 0
          fi
          git commit -m "chore(data): refresh Indonesia job listings"
          for attempt in 1 2 3 4; do
            git fetch origin main
            if git push origin HEAD:main; then
              echo "Scraped dataset committed successfully."
              exit 0
            fi
            echo "Push raced with a newer commit. Rebasing on origin/main (attempt $attempt)."
            git rebase origin/main
            sleep "$((attempt * 2))"
          done
          echo "Could not push refreshed data after four attempts."
          exit 1
