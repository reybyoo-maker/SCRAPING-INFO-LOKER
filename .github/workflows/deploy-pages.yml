name: Deploy INFO LOKER website

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "data/jobs.json"
      - "data/run_status.json"
      - "config/locations.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build website bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/data _site/config
          cp index.html _site/index.html
          cp data/jobs.json _site/data/jobs.json
          cp data/run_status.json _site/data/run_status.json
          cp config/locations.json _site/config/locations.json
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/data/jobs.json
          python - <<'PY'
          import json
          from pathlib import Path
          dataset = json.loads(Path("_site/data/jobs.json").read_text(encoding="utf-8"))
          jobs = dataset if isinstance(dataset, list) else dataset.get("jobs", [])
          if not isinstance(jobs, list):
              raise SystemExit("Dataset must be a JSON list or contain a jobs list")
          print(f"Website package ready: {len(jobs)} jobs")
          PY

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
