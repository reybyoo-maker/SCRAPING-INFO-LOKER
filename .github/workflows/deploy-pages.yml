name: Deploy INFO LOKER website

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate website and dataset
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate website and extract application script
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          if "<!doctype html>" not in html.lower():
              raise SystemExit("index.html is missing a doctype")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S | re.I)
          if len(scripts) != 1:
              raise SystemExit(f"Expected exactly one inline app script, got {len(scripts)}")
          Path("/tmp/info-loker-app.js").write_text(scripts[0], encoding="utf-8")
          dataset = json.loads(Path("data/jobs.json").read_text(encoding="utf-8"))
          jobs = dataset if isinstance(dataset, list) else dataset.get("jobs", [])
          if not isinstance(jobs, list):
              raise SystemExit("data/jobs.json must be a list or contain a jobs list")
          locations = json.loads(Path("config/locations.json").read_text(encoding="utf-8"))
          if not isinstance(locations.get("regions", []), list) or not isinstance(locations.get("cities", []), list):
              raise SystemExit("config/locations.json has an unexpected shape")
          print(f"Website HTML valid; dataset has {len(jobs)} records; location config parsed")
          PY

      - name: Check JavaScript syntax
        run: node --check /tmp/info-loker-app.js

  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build website bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/data _site/config
          cp index.html _site/index.html
          cp data/jobs.json _site/data/jobs.json
          cp data/run_status.json _site/data/run_status.json
          cp config/locations.json _site/config/locations.json
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/data/jobs.json

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
