name: Scraper Tests

on:
  push:
    branches: [main]
    paths:
      - "scraper/**"
      - "tests/**"
      - "requirements.txt"
      - "config/locations.json"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "scraper/**"
      - "tests/**"
      - "requirements.txt"
      - "config/locations.json"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q scraper tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
