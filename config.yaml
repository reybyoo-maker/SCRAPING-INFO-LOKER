# INFO LOKER sources.
# Public RSS/APIs remain active. Site adapters run only when enabled AND authorized,
# and only when robots.txt permits the requested URL.
# Non-official/permission-gated endpoints stay disabled until written permission is obtained.
version: 1
timezone: Asia/Jakarta
legacy_pipeline:
  enabled: true
  query_batch_size: 120
  retention_days: 120
  timeout_seconds: 30
  max_workers: 4
rotation:
  requests_per_source_per_run: 1
  max_workers: 4
  min_delay_seconds: 2
  max_delay_seconds: 5
keywords:
  - lowongan kerja
  - loker terbaru
  - rekrutmen
  - staff
  - admin
  - customer service
  - operator produksi
  - warehouse
  - sales
  - marketing
  - finance
  - programmer
  - data analyst
  - magang
  - fresh graduate
  - walk in interview
sources:
  jobstreet:
    enabled: false
    authorized: false
    search_url: "https://id.jobstreet.com/id/job-search/lowongan-kerja?keywords={keyword}&where={location}"
    permission: "Explicit written consent is required by the current terms before automated collection; activate only after permission is granted."
  indeed:
    enabled: false
    authorized: false
    search_url: "https://id.indeed.com/jobs?q={keyword}&l={location}"
    permission: "Current terms prohibit automated scraping/extraction without express written permission; robots.txt alone is not broad republication permission."
  glints:
    enabled: false
    authorized: false
    search_url: "https://glints.com/id/opportunities/jobs/explore?keyword={keyword}&locationName={location}"
    permission: "Terms prohibit screen scraping/data extraction for republication without prior written consent; robots.txt also disallows the configured explore URL."
  kalibrr:
    enabled: true
    authorized: true
    search_url: "https://www.kalibrr.id/home/i/general-services/t/full-time/1"
    permission: "Public HTML adapter; each run verifies robots.txt. 403/429 or a selector mismatch is logged and retried on later scheduled runs."
  karir:
    enabled: false
    authorized: false
    search_url: "https://karir-ms-beta.karir.com/v2/search/opportunities"
    request_method: POST
    page_size: 50
    permission: "INACTIVE - written permission or official API documentation required. The endpoint is referenced by third-party material, not documented in Karir.com's official developer docs; Karir.com terms prohibit automated data collection without permission."
  dealls:
    enabled: true
    authorized: true
    search_url: "https://dealls.com/loker"
    permission: "Public listing HTML only; robots.txt is checked first. No login, private endpoint probing, or access-control bypass."
  linkedin:
    enabled: false
    authorized: false
    search_url: "https://www.linkedin.com/jobs/search/?keywords={keyword}&location={location}"
    permission: "Disabled by default; terms restrict unauthorized scraping and circumvention. Any enablement requires authorized access and remains the user's responsibility."
  lokerid:
    enabled: false
    authorized: false
    search_url: "https://www.loker.id/cari-lowongan-kerja?keyword={keyword}&lokasi={location}"
    permission: "Terms restrict copying/distributing website content without written permission; enable only with authorized feed or written permission."
  disnakerja:
    enabled: false
    authorized: false
    search_url: "https://disnakerja.id/?s={keyword}"
    permission: "Terms restrict reproducing/distributing website content without written consent; enable only with permission or an authorized feed."
  techinasia:
    enabled: false
    authorized: false
    search_url: "https://www.techinasia.com/jobs"
    permission: "INACTIVE - no official Jobs RSS feed was verified. The general /feed route is disallowed by robots.txt; do not substitute it for a jobs feed. Reassess only if Tech in Asia publishes an allowed official Jobs feed."
  maganghub:
    enabled: true
    authorized: true
    search_url: "https://maganghub.kemnaker.go.id/"
    min_delay_seconds: 5
    max_delay_seconds: 10
    permission: "Use a transparent INFO LOKER User-Agent and Indonesian Accept-Language. Respect robots.txt; if the site returns 403/429, log blocked and do not disguise the client or bypass the restriction."
