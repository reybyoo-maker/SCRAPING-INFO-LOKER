# INFO LOKER sources.
# The primary public RSS/API collector remains active. Site-specific adapters are
# attempted only when enabled AND authorized, then only if robots.txt permits the URL.
# 403/429 and parser mismatches are logged per source; no adapter is permanently disabled.
version: 1
timezone: Asia/Jakarta
legacy_pipeline:
  enabled: true
  query_batch_size: 120
  retention_days: 120
  timeout_seconds: 30
  max_workers: 4
rotation:
  requests_per_source_per_run: 1
  max_workers: 4
  min_delay_seconds: 2
  max_delay_seconds: 5
keywords:
  - lowongan kerja
  - loker terbaru
  - rekrutmen
  - staff
  - admin
  - customer service
  - operator produksi
  - warehouse
  - sales
  - marketing
  - finance
  - programmer
  - data analyst
  - magang
  - fresh graduate
  - walk in interview
sources:
  jobstreet:
    enabled: false
    authorized: false
    search_url: "https://id.jobstreet.com/id/job-search/lowongan-kerja?keywords={keyword}&where={location}"
    permission: "Explicit written consent is required by the current terms before automated collection; activate only after permission is granted."
  indeed:
    enabled: false
    authorized: false
    search_url: "https://id.indeed.com/jobs?q={keyword}&l={location}"
    permission: "Current terms prohibit automated scraping/extraction without express written permission; robots.txt alone is not broad republication permission."
  glints:
    enabled: false
    authorized: false
    search_url: "https://glints.com/id/opportunities/jobs/explore?keyword={keyword}&locationName={location}"
    permission: "Terms prohibit screen scraping/data extraction for republication without prior written consent; robots.txt also disallows the configured explore URL."
  kalibrr:
    enabled: true
    authorized: true
    search_url: "https://www.kalibrr.com/id-ID/job-board/te/{keyword}?location={location}"
    permission: "Public HTML adapter; each run verifies robots.txt. 403/429 or a selector mismatch is logged and retried on later scheduled runs."
  karir:
    enabled: false
    authorized: false
    search_url: "https://www.karir.com/search?q={keyword}"
    permission: "Current terms prohibit automated data collection without permission."
  dealls:
    enabled: true
    authorized: true
    search_url: "https://dealls.com/jobs?search={keyword}"
    permission: "Public listing HTML only; robots.txt is checked first. No login, private endpoint probing, or access-control bypass."
  linkedin:
    enabled: false
    authorized: false
    search_url: "https://www.linkedin.com/jobs/search/?keywords={keyword}&location={location}"
    permission: "Disabled by default; terms restrict unauthorized scraping and circumvention. Any enablement requires authorized access and remains the user's responsibility."
  lokerid:
    enabled: false
    authorized: false
    search_url: "https://www.loker.id/cari-lowongan-kerja?keyword={keyword}&lokasi={location}"
    permission: "Terms restrict copying/distributing website content without written permission; enable only with authorized feed or written permission."
  disnakerja:
    enabled: false
    authorized: false
    search_url: "https://disnakerja.id/?s={keyword}"
    permission: "Terms restrict reproducing/distributing website content without written consent; enable only with permission or an authorized feed."
  techinasia:
    enabled: true
    authorized: true
    search_url: "https://www.techinasia.com/jobs/search?query={keyword}"
    permission: "Only public pages allowed by robots.txt are queried. No full article mirroring; metadata and source links only. Parser mismatches are logged without auto-disabling."
  maganghub:
    enabled: true
    authorized: true
    search_url: "https://maganghub.kemnaker.go.id/magang-nasional/faq"
    permission: "Public government site adapter; robots.txt must be readable and permit the configured URL or the source will be skipped and logged."
